name: Uno Windows candidate (not release acceptance)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Directory.*'
      - 'SmartSnippets.slnx'
      - '.github/workflows/uno-windows-candidate.yml'

jobs:
  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/SmartSnippets.Uno/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Sequential projects: each references the same Core output directory.
      - name: Core regression tests
        run: dotnet test tests/SmartSnippets.Core.Tests -c Release
      - name: Presentation regression tests
        run: dotnet test tests/SmartSnippets.Presentation.Tests -c Release
      - name: Import budget
        run: dotnet test tests/SmartSnippets.Presentation.Tests -c Release --filter "Category=Budget"
      - name: Candidate locked restore (pinned SDK cwd)
        working-directory: src/SmartSnippets.Uno
        run: dotnet restore SmartSnippets.Uno.csproj -r win-x64 -p:Configuration=Release -p:ContinuousIntegrationBuild=true
      - name: Candidate composition tests (pinned SDK cwd)
        working-directory: src/SmartSnippets.Uno
        run: dotnet test ../../tests/SmartSnippets.Uno.Tests -c Release -p:ContinuousIntegrationBuild=true
      - name: Candidate build and startup-observer negative controls (no native launch)
        run: python -B -m unittest discover -s scripts/tests -p 'test_uno_candidate*.py' -q
      - name: Candidate fresh strict Native AOT gate
        shell: pwsh
        run: |
          ./scripts/publish-uno-candidate-aot.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The existing legacy workflow and script remain unchanged and independently usable.
      - name: Legacy AOT regression gate
        shell: pwsh
        run: |
          ./scripts/publish-aot.ps1 -Output publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: UnoCandidate-win-x64-build-only
          path: src/SmartSnippets.Uno/bin/publish-uno-candidate/*/
          if-no-files-found: error
          # Upload binary/build-check receipt only, never private host compiler logs.
