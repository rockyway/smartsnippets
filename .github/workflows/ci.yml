name: CI

on:
  # Runs when work lands on main, skipping commits that only touch documentation.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Manual run for a feature branch, e.g. to compile WinUI/XAML changes before merging.
  workflow_dispatch:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/SmartSnippets.Core.Tests
      - run: dotnet test tests/SmartSnippets.Presentation.Tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet test tests/SmartSnippets.Core.Tests
      - name: Presentation tests
        run: dotnet test tests/SmartSnippets.Presentation.Tests
      - name: Import budget (Release)
        run: dotnet test tests/SmartSnippets.Presentation.Tests -c Release --filter "Category=Budget"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/SmartSnippets.Uno/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Uno composition and behavior tests (pinned SDK cwd)
        working-directory: src/SmartSnippets.Uno
        run: dotnet test ../../tests/SmartSnippets.Uno.Tests -c Release -p:ContinuousIntegrationBuild=true
      - name: AOT validator negative tests
        run: python -B -m unittest discover -s scripts/tests -q
      - name: AOT publish + warning gate
        shell: pwsh
        run: |
          ./scripts/publish-uno-aot.ps1 -Version "0.0.0-ci.${{ github.run_number }}" -BuildNumber ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check stamped version
        shell: pwsh
        run: |
          $info = (Get-Item publish/SmartSnippets.exe).VersionInfo
          if (($info.ProductVersion -split '\+')[0] -ne '0.0.0-ci.${{ github.run_number }}' -or $info.FileVersion -ne '0.0.0.${{ github.run_number }}') { throw 'Version stamp mismatch' }
      - uses: actions/upload-artifact@v7
        with:
          name: SmartSnippets-win-x64-aot
          path: publish/
